name = "narasi-media-api"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8c51473ea56232160062c80c1334b2a7"

# Cloudflare D1 Database (Free Tier)
[[d1_databases]]
binding = "DB"
database_name = "narasi-media-prod"
database_id = "16f3733c-e62d-4167-86a5-a5efddd77f4e"

# Cloudflare R2 Bucket for Manual QRIS Proof Uploads (Enable R2 in Cloudflare Dashboard to activate)
# [[r2_buckets]]
# binding = "RECEIPTS_BUCKET"
# bucket_name = "narasi-media-receipts"

# Cloudflare KV for Session Cache & Rate Limiting (Free Tier 100k reads/day)
[[kv_namespaces]]
binding = "KV_CACHE"
id = "8eabacc5d73d487d8ac3bd5183109407"

[vars]
ENVIRONMENT = "production"
BONUS_DEPOSIT_PERCENTAGE = "5.0"
SUPABASE_URL = "https://ludajhsolkglttpnuajz.supabase.co"
