version: '3.8'

services:
  narasi-backend:
    build:
      context: ../../narasi-media-backend
      dockerfile: ../narasi-media-infra/vps/Dockerfile.backend
    restart: always
    environment:
      - PORT=8080
      - RUST_LOG=info
    expose:
      - "8080"
    networks:
      - narasi-net

  narasi-web:
    build:
      context: ../../narasi-media-frontend-web-apps
      dockerfile: ../narasi-media-infra/vps/Dockerfile.frontend
    restart: always
    expose:
      - "80"
    networks:
      - narasi-net

  narasi-admin:
    build:
      context: ../../narasi-media-frontend-admin-panel
      dockerfile: ../narasi-media-infra/vps/Dockerfile.admin
    restart: always
    expose:
      - "80"
    networks:
      - narasi-net

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - narasi-backend
      - narasi-web
      - narasi-admin
    networks:
      - narasi-net

networks:
  narasi-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
